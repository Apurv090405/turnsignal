[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnsignal"
version = "0.1.0"
description = "Minimal-deps Python voice-AI library with telco-native turn-taking."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dinesh", email = "Dinesh@codiste.com" }]
keywords = ["voice", "ai", "telco", "stt", "tts", "llm", "asyncio", "turn-taking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "soxr>=0.3",
]

[project.optional-dependencies]
twilio = ["websockets>=12"]
http = ["httpx>=0.27"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["turnsignal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
